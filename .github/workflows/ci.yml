name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/motion.test.js
      - run: python3 -m flyhigh.import_history --input examples/canonical.json --symbol COPY --assumed-liquidity 10000 --output data/copy.report.json
